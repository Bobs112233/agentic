# Render blueprint. In the Render dashboard: New > Blueprint > pick this repo.
# ANTHROPIC_API_KEY and ADMIN_PASSWORD are typed into the dashboard, never committed.
services:
  - type: web
    name: adforge-g33
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ADFORGE_MODEL
        value: claude-haiku-5-5
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_PASSWORD
        sync: false
